<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard Operacional MessiCr7</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Navegação principal">
        <div class="brand">
          <span class="brand-mark">M7</span>
          <div>
            <strong>MessiCr7</strong>
            <small>Operação diária</small>
          </div>
        </div>

        <nav class="nav-list" aria-label="Áreas do dashboard">
          <button class="nav-item active" data-view="today">Hoje</button>
          <button class="nav-item" data-view="tasks">Tarefas</button>
          <button class="nav-item" data-view="social">Social Media</button>
          <button class="nav-item" data-view="investments">Investimentos</button>
          <button class="nav-item" data-view="time">Tempo</button>
          <button class="nav-item" data-view="stats">Estatísticas</button>
        </nav>

        <section class="sidebar-panel">
          <span class="eyebrow">Tarefa ativa</span>
          <strong id="activeTaskTitle">Nenhuma tarefa ativa</strong>
          <small id="activeTaskMeta">Use o Telegram para iniciar uma tarefa.</small>
        </section>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <span class="eyebrow">Dashboard operacional</span>
            <h1 id="viewTitle">Hoje</h1>
          </div>
          <div class="topbar-actions">
            <select id="frontFilter" aria-label="Filtrar por frente">
              <option value="all">Todas as frentes</option>
              <option value="Social Media">Social Media</option>
              <option value="Pessoal">Pessoal</option>
              <option value="Investimentos">Investimentos</option>
              <option value="Agenda">Agenda</option>
            </select>
            <select id="statusFilter" aria-label="Filtrar por status">
              <option value="all">Todos os status</option>
              <option value="A fazer">A fazer</option>
              <option value="Em execução">Em execução</option>
              <option value="Aguardando">Aguardando</option>
              <option value="Concluída">Concluída</option>
              <option value="Atrasada">Atrasada</option>
            </select>
          </div>
        </header>

        <section class="metric-grid" aria-label="Métricas principais">
          <article class="metric-card">
            <small>Abertas</small>
            <strong id="metricOpen">0</strong>
            <span>Tarefas em aberto</span>
          </article>
          <article class="metric-card">
            <small>Atrasadas</small>
            <strong id="metricLate">0</strong>
            <span>Precisam de ação</span>
          </article>
          <article class="metric-card">
            <small>Hoje</small>
            <strong id="metricTodayHours">0h</strong>
            <span>Tempo registrado</span>
          </article>
          <article class="metric-card">
            <small>Semana</small>
            <strong id="metricWeekHours">0h</strong>
            <span>Volume operacional</span>
          </article>
        </section>

        <section id="viewContent" class="content-grid" aria-live="polite"></section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
